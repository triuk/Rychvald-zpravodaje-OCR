name: OCR tools
on:
  push:
  pull_request:
jobs:
  stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Syntax (lightweight hosted checks only)
        run: |
          python -m compileall -q tools tests
      - name: Standard-library quality, registry and query regressions
        working-directory: tests
        run: python -m unittest -v test_ocr_quality.QualityTests test_ocr_projects test_ocr_project_review
