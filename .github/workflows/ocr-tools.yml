name: OCR tools
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Syntax and quality-gate regression tests
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v
